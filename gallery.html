<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Krison Paradise | Luxury Cabin in Broken Bow</title>

    <!-- Chosen Palette: Warm Neutrals, Deep Forest, Soft Beige, Muted Sage -->
    <!-- Application Structure Plan: Intro -> Philosophy -> Highlights -> Immersive Draggable Gallery. -->
    <!-- Visualization & Content Choices: Custom cursor and GSAP interpolated drag slider for the gallery to emulate cutting-edge editorial web design. Asymmetric placements to create artistic tension. -->
    <!-- CONFIRMATION: NO SVG graphics used. NO Mermaid JS used. -->

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://unpkg.com/@studio-freight/lenis@1.0.34/dist/lenis.min.js"></script>
    <script src="https://unpkg.com/split-type"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <link rel="stylesheet" href="css/index.css">
</head>

<body class="antialiased">

    <!-- Preloader -->
    <div id="preloader" class="fixed inset-0 z-[100] bg-[#f4f2ee] flex items-center justify-center">
        <div class="flex flex-col items-center">
            <span class="serif-font text-4xl tracking-widest uppercase mb-4 opacity-0 preloader-text">Krison
                Paradise</span>
            <div class="w-16 h-[1px] bg-[#c5a059] scale-x-0 preloader-line"></div>
        </div>
    </div>

    <!-- Custom Cursor Removed -->

    <nav id="navbar"
        class="fixed top-0 left-1/2 transform -translate-x-1/2 w-full z-50 transition-all duration-700 py-6 px-6 md:px-12 flex justify-between items-center text-white border-b border-white/20">
        <!-- Left Links -->
        <div
            class="hidden md:flex flex-1 justify-start space-x-10 text-[0.65rem] tracking-[0.25em] uppercase font-light">
            <a href="index.html" class="hover:text-[#c5a059] transition-colors duration-300">Resort</a>
            <a href="contact.html" class="hover:text-[#c5a059] transition-colors duration-300">Contact</a>
        </div>

        <!-- Center Logo -->
        <div class="flex-1 flex justify-center z-10">
            <a href="index.html" class="flex flex-col items-center">
                <span class="serif-font text-3xl md:text-4xl tracking-widest uppercase">Krison Paradise</span>
                <span class="text-[0.45rem] tracking-[0.4em] font-sans font-light mt-2 uppercase text-[#c5a059]">Luxury
                    Cabin</span>
            </a>
        </div>

        <!-- Right Links & CTA -->
        <div
            class="hidden md:flex flex-1 justify-end items-center space-x-10 text-[0.65rem] tracking-[0.25em] uppercase font-light">
            <a href="gallery.html" class="hover:text-[#c5a059] transition-colors duration-300">Gallery</a>
            <a href="https://www.beaversbendcreativeescape.com/vrp/unit/Krison_Paradise-359-15" target="_blank"
                class="border border-white/50 px-6 py-3 hover:bg-white hover:text-black transition-all duration-300 magnetic">Reserve</a>
        </div>

        <!-- Mobile Menu Button -->
        <button class="md:hidden text-2xl focus:outline-none absolute right-6 font-light">&#9776;</button>
    </nav>

    <!-- Removed Hero and Info sections for standalone Gallery page -->
    <!-- SECTION 4: Interactive Draggable Gallery (Muted Sage Green Background matching Palma Real) -->
    <section id="gallery" class="gallery-section bg-[#9eab88] relative section-padding overflow-hidden">
        <!-- Header for the section -->
        <div class="absolute top-12 left-12 md:left-24 z-10 pointer-events-none">
            <h2 class="serif-font text-3xl md:text-5xl text-white opacity-90 tracking-wide uppercase">Gallery</h2>
            <p class="text-white/70 text-sm mt-2 font-light tracking-widest uppercase">A visual journey through Krison
                Paradise</p>
        </div>

        <div class="gallery-content mt-24 md:mt-32">
            <!-- Vertical Dots -->
            <div class="m-bullets-nav swiper-pagination hidden md:flex"></div>

            <!-- Slider -->
            <div class="swiper">
                <div class="swiper-wrapper">
                    <!-- Slide 1 -->
                    <div class="swiper-slide">
                        <img src="assets/img/living room2.jpg" alt="Gallery Image 1">
                    </div>
                    <!-- Slide 2 -->
                    <div class="swiper-slide">
                        <img src="assets/img/pool table.jpg" alt="Gallery Image 2">
                    </div>
                    <!-- Slide 3 -->
                    <div class="swiper-slide">
                        <img src="assets/img/bath tub.jpg" alt="Gallery Image 3">
                    </div>
                    <!-- Slide 4 -->
                    <div class="swiper-slide">
                        <img src="assets/img/bed room 1.jpg" alt="Gallery Image 4">
                    </div>
                    <!-- Slide 5 -->
                    <div class="swiper-slide">
                        <img src="assets/img/_F7A5982.jpg" alt="Gallery Image 5">
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Removed Reviews section for standalone Gallery page -->
    <footer class="bg-[#1a1a1a] text-white section-padding text-center">
        <div class="fade-up">
            <div class="serif-font text-4xl mb-6 tracking-widest uppercase">Krison Paradise</div>
            <p class="text-[#888] font-light mb-12 max-w-md mx-auto leading-relaxed">Elevating the wilderness
                experience. Disconnect from the noise, reconnect with yourself in Broken Bow.</p>
            <div class="flex justify-center space-x-12 text-[0.65rem] tracking-[0.3em] uppercase text-[#666]">
                <a href="gallery.html" class="hover:text-white transition-colors">Gallery</a>
                <a href="contact.html" class="hover:text-white transition-colors">Contact</a>
                <a href="mailto:krisonventures@gmail.com" class="hover:text-white transition-colors">Email</a>
            </div>
            <div class="mt-20 text-[0.55rem] tracking-widest uppercase text-[#444]">
                &copy;
                <script>document.write(new Date().getFullYear())</script> Krison Paradise.
            </div>
        </div>
    </footer>

    <!-- Custom Cursor -->
    <div id="global-cursor" class="global-cursor"></div>

    <!-- Custom Cursor -->
    <div id="gallery-cursor" class="gallery-cursor">
        <svg class="svg-bidirectional" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
            stroke-width="1" stroke-linecap="square" stroke-linejoin="miter">
            <path d="M7 8l-3-3 3-3M4 5h16M17 19l3-3-3-3M20 16H4" />
        </svg>
        <svg class="svg-single" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="1"
            stroke-linecap="square" stroke-linejoin="miter">
            <path d="M5 12h14M14 5l6 7-6 7" />
        </svg>
    </div>

    <script src="js/index.js"></script>
</body>

</html>
